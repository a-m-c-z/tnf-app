<!DOCTYPE html>
<html>
<head>
    <title>Rating Submitted — TNF</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --green:   #1a7a2e;
            --green-l: #2d9e45;
            --bibs:    #f5c518;
            --colours: #dc3545;
            --bg:      #0f1a12;
            --card:    #1a2b1e;
            --border:  #2a3d2e;
            --text:    #e8f0e9;
            --muted:   #7a9a7e;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }

        header {
            background: linear-gradient(135deg, #0a1a0d 0%, #1a3020 100%);
            border-bottom: 2px solid var(--green);
            padding: 18px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: relative;
        }

        header h1 {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 2rem;
            letter-spacing: 3px;
            color: var(--bibs);
        }

        header nav a {
            color: var(--muted);
            text-decoration: none;
            font-size: 0.85rem;
            margin-left: 20px;
            transition: color .2s;
        }
        header nav a:hover { color: var(--text); }
        header nav a.active { color: var(--bibs); font-weight: 600; }

        .hamburger {
            display: none;
            flex-direction: column;
            justify-content: center;
            gap: 5px;
            width: 30px;
            height: 30px;
            background: transparent;
            border: none;
            cursor: pointer;
            padding: 0;
        }
        .hamburger span {
            display: block;
            height: 2px;
            width: 100%;
            background: var(--text);
            border-radius: 2px;
            transition: transform .2s ease, opacity .2s ease;
        }
        .hamburger.open span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
        .hamburger.open span:nth-child(2) { opacity: 0; }
        .hamburger.open span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }

        @media (max-width: 720px) {
            .hamburger { display: flex; }
            header nav {
                display: none;
                position: absolute;
                top: 100%;
                left: 0;
                right: 0;
                flex-direction: column;
                background: var(--card);
                border-bottom: 2px solid var(--green);
                padding: 8px 0;
                z-index: 50;
            }
            header nav.open { display: flex; }
            header nav a {
                margin-left: 0;
                padding: 12px 24px;
                border-top: 1px solid var(--border);
            }
            header nav a:first-child { border-top: none; }
        }

        main {
            max-width: 480px;
            margin: 0 auto;
            padding: 80px 20px;
        }

        .success-box {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 40px 36px;
            text-align: center;
        }
        .checkmark {
            font-size: 60px;
            color: #4caf50;
            margin-bottom: 20px;
        }
        .success-box h2 {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1.8rem;
            letter-spacing: 2px;
            color: var(--bibs);
            margin-bottom: 10px;
        }
        .success-box p {
            color: var(--muted);
            font-size: 1rem;
            margin-bottom: 28px;
        }
        .buttons {
            display: flex;
            gap: 14px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .buttons a {
            display: inline-block;
            padding: 12px 22px;
            text-decoration: none;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            transition: background .2s, opacity .2s;
        }
        .btn-primary { background: var(--green-l); color: white; }
        .btn-primary:hover { background: var(--green); }
        .btn-secondary {
            background: transparent;
            color: var(--text);
            border: 1px solid var(--border);
        }
        .btn-secondary:hover { border-color: var(--green-l); }
    </style>
</head>
<body>
    <header>
        <h1>⚽ TNF</h1>
        <nav>
            <a href="/team_picker" class="{{ 'active' if request.path in ['/team_picker', '/generate_teams', '/confirm_teams'] else '' }}">Team Picker</a>
            <a href="/rate" class="{{ 'active' if request.path.startswith('/rate') or request.path.startswith('/submit_rating') or request.path.startswith('/thank_you') else '' }}">Rate</a>
            <a href="/results" class="{{ 'active' if request.path == '/results' else '' }}">Ratings</a>
            {% if nav_show_standings %}<a href="/standings" class="{{ 'active' if request.path == '/standings' else '' }}">Standings</a>{% endif %}
            {% if nav_voting_open %}<a href="/vote" class="{{ 'active' if request.path.startswith('/vote') else '' }}">Awards Vote</a>{% endif %}
            <a href="/admin" class="{{ 'active' if request.path.startswith('/admin') else '' }}">Admin</a>
        </nav>
        <button class="hamburger" onclick="toggleNav(this)" aria-label="Toggle menu"><span></span><span></span><span></span></button>
    </header>

    <main>
        <div class="success-box">
            <div class="checkmark">✓</div>
            <h2>Rating Submitted!</h2>
            <p>Thank you for rating {{ player[1] }}</p>

            <div class="buttons">
                <a href="/rate" class="btn-primary">Rate Another Player</a>
                <a href="/results" class="btn-secondary">View Results</a>
            </div>
        </div>
    </main>

    <script>
        function toggleNav(btn) {
            const nav = btn.parentElement.querySelector('nav');
            nav.classList.toggle('open');
            btn.classList.toggle('open');
        }
    </script>
</body>
</html>
